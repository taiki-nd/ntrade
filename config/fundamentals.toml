# ファンダメンタルズの事実データ（LLM に渡す）の取得設定。
#
# 方針: 「上がりそう/下がりそう」といった見解・予想・センチメントを含まない、事実だけを公開している
# 一次情報源（公的統計・中央銀行・取引所の建玉報告）から API で取得する。解釈は LLM が行う。
# LLM の判断時には Web 検索をさせない（`claude -p` は Read ツールのみ・MCP なしで起動する）。
#
# API キーは .env で渡す（無ければその情報源だけ取得しない）:
#   FRED_API_KEY   … FRED（米セントルイス連銀）。https://fred.stlouisfed.org/docs/api/api_key.html
#   EIA_API_KEY    … EIA（米エネルギー情報局）。https://www.eia.gov/opendata/register.php
#   CFTC_APP_TOKEN … 任意。CFTC Socrata のレート制限緩和用
#
# 系列 ID の書式:
#   fred:<SERIES_ID>               FRED の系列（例 fred:DFII10）
#   ust:<満期>                      米財務省 名目利回り（3M / 2Y / 5Y / 10Y / 30Y など）
#   ust_real:<満期>                 米財務省 実質利回り（5Y / 10Y / 30Y など）
#   jgb:<満期>                      日本財務省 国債金利（2Y / 5Y / 10Y / 30Y など）
#   eia:<route>:<SERIES>           EIA API v2 の系列（例 eia:petroleum/stoc/wstk:WCESTUS1）
# COT は CFTC の contract market code（例 088691 = 金）。

enabled = true

[sources]
fred = true
treasury = true
jgb = true
cftc = true
eia = true
calendar = true
press = true

[calendar]
# Forex Factory の週次フィード（予定時刻・指標名・前回値）。公式 API ではないので頻繁に叩かないこと（5分に2回まで）
url = "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
# 市場予想（コンセンサス）を含めるか。指標値の予想であって値動きの予想ではないが、
# 「事実のみ」を厳密に守るなら false のままにする
include_forecast = false
# 重要度ラベル（High / Medium / Low）を含めるか。配信元の編集上の分類
include_impact = true
lookback_hours = 24
lookahead_hours = 168

[press]
lookback_days = 7
max_items = 12

[refresh_minutes]
series = 360
cot = 360
calendar = 60
press = 15

# 予定された指標の発表直後に、関係する銘柄の判断を（判断間隔を待たずに）回す。
# 取引設定の「指標発表後に判断」が有効なときだけ使う
[event_trigger]
impacts = ["High"]
# 発表時刻からこの分数の間に来た 5M 足確定で判断する
window_minutes = 10

# 公式発表の RSS（タイトル・日時・リンクだけを使う。講演・解説系のフィードは入れない）
# EIA の press RSS は短期見通し（"EIA expects ..."）の見出しを含むので入れない（在庫統計の数値は eia: 系列で取る）
[feeds]
fed_monetary = "https://www.federalreserve.gov/feeds/press_monetary.xml"
fed_all = "https://www.federalreserve.gov/feeds/press_all.xml"
ecb = "https://www.ecb.europa.eu/rss/press.html"
boj = "https://www.boj.or.jp/en/rss/whatsnew.xml"
bea = "https://apps.bea.gov/rss/rss.xml"

# 通貨ごとの事実セット。FX は基軸・建値の両通貨のセットを合わせて使う
[currencies.USD]
series = ["fred:DFF", "ust:3M", "ust:2Y", "ust:10Y", "ust_real:10Y", "fred:T10YIE", "fred:DTWEXBGS", "fred:CPIAUCSL", "fred:PCEPILFE", "fred:UNRATE", "fred:PAYEMS"]
press = ["fed_monetary", "bea"]
calendar = ["USD"]

[currencies.JPY]
series = ["jgb:2Y", "jgb:10Y", "jgb:30Y"]
cot = ["097741"]
press = ["boj"]
calendar = ["JPY"]

[currencies.EUR]
series = ["fred:ECBDFR", "fred:IRLTLT01EZM156N"]
cot = ["099741"]
press = ["ecb"]
calendar = ["EUR"]

[currencies.GBP]
series = ["fred:IRLTLT01GBM156N"]
cot = ["096742"]
calendar = ["GBP"]

[currencies.AUD]
series = ["fred:IRLTLT01AUM156N"]
cot = ["232741"]
calendar = ["AUD"]

[currencies.CAD]
series = ["fred:IRLTLT01CAM156N"]
cot = ["090741"]
calendar = ["CAD"]

[currencies.CHF]
series = ["fred:IRLTLT01CHM156N"]
cot = ["092741"]
calendar = ["CHF"]

[currencies.NZD]
cot = ["112741"]
calendar = ["NZD"]

# FX 以外の銘柄。`match` のいずれかを銘柄名に含めば適用（大文字小文字は無視）。
# `related` はブローカーの銘柄名（口座サフィックスは対象銘柄と同じものを自動で補う）。日足の騰落を事実として渡す
[[profiles]]
name = "gold"
match = ["XAU", "GOLD"]
currencies = ["USD"]
series = ["fred:VIXCLS"]
cot = ["088691"]
related = ["XAGUSD", "EURUSD", "USDJPY", "US500"]

[[profiles]]
name = "silver"
match = ["XAG", "SILVER"]
currencies = ["USD"]
series = ["fred:VIXCLS"]
cot = ["084691"]
related = ["XAUUSD", "EURUSD", "US500"]

[[profiles]]
name = "us_equity_index"
match = ["US500", "SPX", "US30", "DJ30", "NAS100", "USTEC", "US100"]
currencies = ["USD"]
series = ["fred:VIXCLS", "fred:BAMLH0A0HYM2"]
cot = ["13874A"]
related = ["XAUUSD", "USDJPY", "EURUSD"]

[[profiles]]
name = "japan_equity_index"
match = ["JP225", "JPN225", "NIKKEI"]
currencies = ["JPY", "USD"]
series = ["fred:VIXCLS"]
related = ["USDJPY", "US500"]

[[profiles]]
name = "crude_oil"
match = ["WTI", "XTI", "USOIL", "OIL", "BRENT", "XBR", "UKOIL"]
currencies = ["USD"]
series = ["fred:DCOILWTICO", "eia:petroleum/stoc/wstk:WCESTUS1", "eia:petroleum/stoc/wstk:WCSSTUS1"]
cot = ["067651"]
related = ["US500", "USDCAD"]
