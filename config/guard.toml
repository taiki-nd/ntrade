# 事後ガード設定（docs/02_trading_strategy.md 7章）
# ここにある数値は「判断」ではなく「リスク管理」。LLM のプロンプトには書かない。
#
# 本番エンジンでは初回起動時の初期値としてだけ使う。以後は SQLite（app_settings）に保存された値が正で、
# ダッシュボードの設定画面から変更する（このファイルを直しても反映されない）。リプレイ（bin/replay）は引き続きこのファイルを読む。

# 観測整合: LLM が報告した最新足時刻が Snapshot と一致しなければ HOLD
observed_check = true

# 確信度の下限（リプレイで較正するまでの暫定値）
min_confidence = 0.70

# リスクリワード下限: (TP - entry) / (entry - SL)
min_rr = 1.5

# SL 幅: 下限は 5M ATR(14) の何倍以上、上限は sl_atr_max_tf の ATR(14) の何倍以内か、最小何 pips 以上か
# （pips の下限は FX にだけ当てる。貴金属・株価指数・エネルギーは pip の大きさがブローカーごとに違うので ATR 比だけで見る）
# 上限は上位足で測る。LLM は上位足の構造で SL を置くので、5M で測ると XAUUSD などはほぼ常に超える
sl_atr_min = 0.5
sl_atr_max = 4.0
sl_atr_max_tf = "1h"   # 5m / 15m / 1h / 4h
sl_min_pips = 3.0

# 損切りの執行方法
# touch: LLM の SL をそのままブローカーに置き、ヒゲが触れたら決済
# close: LLM の SL は「5M 確定足の終値で越えたら決済」のラインとして ntrade が判定する。
#        ブローカーには急変に備えて hard_stop_atr × 5M ATR だけ外側にハードSLを置く
stop_mode = "touch"
hard_stop_atr = 2.0

# ポジション上限
max_positions_per_pair = 1
max_positions_total = 1

# 日次損失上限（資金比 %）。到達したらその日は新規発注を遮断
daily_loss_limit_pct = 3.0

# 条件付きプランの最長有効期間（時間）
plan_max_hours = 8.0

# 発注ロット（固定）。risk_pct を設定すると SL 幅から自動計算する。
# 1 lot・1 pip の価値はブローカーの銘柄仕様と直近レートから口座通貨で求める（EURUSD を JPY 口座なら USDJPY で換算）。
# pip_value_per_lot を書くとその固定値を優先する
# lot → 発注量の換算・最小/刻み/最大はブローカーの銘柄仕様（XAUUSD は 1 lot = 100 oz など）に従う。
# risk_pct から求めたロットが最小発注量に届かない場合は、切り上げずに見送る（許容リスクを超えるため）
fixed_volume_lots = 0.01
# risk_pct = 0.5
# pip_value_per_lot = 1000.0

# レバレッジ（書かなければ見ない）。必要証拠金はブローカーに問い合わせる
# 発注後の 使用証拠金 / 有効証拠金（%）の上限
# max_margin_usage_pct = 50.0
# 発注後の 想定元本合計 / 有効証拠金（倍）の上限
# max_effective_leverage = 10.0

# スプレッド上限: 5M ATR に対する比（全銘柄。書かなければ見ない）
# max_spread_atr = 0.5

# スプレッド上限（pips）。銘柄ごとに上書き可能。default は FX にだけ当てる
[max_spread_pips]
default = 1.0
USDJPY = 1.0
EURUSD = 1.2
XAUUSD = 5.0

# 指標ブラックアウト（UTC）。前後の分数の間は新規発注しない
# [[news_blackout]]
# time = "2026-09-18 12:30:00"
# before_min = 30
# after_min = 15
# label = "US CPI"
